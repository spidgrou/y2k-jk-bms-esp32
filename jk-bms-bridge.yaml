# ===== JSON PUBLICATION OVER MQTT =====

interval:
  # THOR
  - interval: 5s
    then:
      - lambda: |-
          if (id(maintenance_mode) || id(thor_maintenance)) {
            JsonDocument doc;
            doc["name"] = "Thor";
            doc["maintenance"] = true;
            doc["online"] = false;
            std::string out;
            serializeJson(doc, out);
            id(mqtt_client).publish("vessels/self/electrical/batteries/Thor", out.c_str());
            return;
          }
          JsonDocument doc;
          doc["voltage"] = id(thor_voltage).state;
          doc["current"] = id(thor_current).state;
          doc["power"] = id(thor_power).state;
          doc["soc"] = id(thor_soc).state;
          doc["capacityRemaining"] = id(thor_cap_rem).state;
          doc["fullChargeCapacity"] = id(thor_full_cap).state;
          doc["minCellVoltage"] = id(thor_min_cell).state;
          doc["maxCellVoltage"] = id(thor_max_cell).state;
          doc["deltaCellVoltage"] = id(thor_delta_cell).state;
          doc["cell1"] = id(thor_cell1).state;
          doc["cell2"] = id(thor_cell2).state;
          doc["cell3"] = id(thor_cell3).state;
          doc["cell4"] = id(thor_cell4).state;
          doc["temp1"] = id(thor_temp1).state;
          doc["temp2"] = id(thor_temp2).state;
          doc["mosfetTemp"] = id(thor_mosfet_temp).state;
          doc["cycles"] = id(thor_cycles).state;
          doc["runtimeS"] = id(thor_runtime).state;
          doc["errors"] = id(thor_errors).state;
          if (id(maintenance_cooldown) > 0) {
            id(maintenance_cooldown)--;
            doc["warning"] = 0;
          } else if (id(boot_cooldown) > 0) {
            id(boot_cooldown)--;
            doc["warning"] = 0;
          } else {
            // Log cambio stato online/offline
            {
              bool online = id(thor_online).state;
              if (online != id(thor_was_online)) {
                if (online) ESP_LOGI("thor", "Thor back ONLINE");
                else ESP_LOGI("thor", "Thor OFFLINE!");
                id(thor_was_online) = online;
              }
            }
            {
              int offline_count_all = 0;
              if (!id(thor_online).state) offline_count_all++;
              if (!id(pos_online).state) offline_count_all++;
              if (!id(zeus_online).state) offline_count_all++;
              if (!id(odin_online).state) offline_count_all++;
              std::string err = id(thor_errors).state;
              bool has_errors = id(thor_online).state && !err.empty() && err != "Offline";
              if (has_errors) { doc["warning"] = 1; ESP_LOGW("thor", "Thor: WARNING -> errors=[%s] online=%d", id(thor_errors).state.c_str(), id(thor_online).state); }
              else if (offline_count_all >= 3) { doc["warning"] = 1; ESP_LOGW("thor", "Thor: 3+ batterie offline, warning immediato"); }
              else doc["warning"] = 0;
            }
          }
          doc["name"] = "Thor";
          doc["charging"] = id(thor_charging).state;
          doc["discharging"] = id(thor_discharging).state;
          doc["balancing"] = id(thor_balancing).state;
          doc["heating"] = id(thor_heating).state;
          doc["online"] = id(thor_online).state;
          std::string out;
          serializeJson(doc, out);
          id(mqtt_client).publish("vessels/self/electrical/batteries/Thor", out.c_str());

  # POSEIDONE
  - interval: 5s
    then:
      - lambda: |-
          if (id(maintenance_mode) || id(pos_maintenance)) {
            JsonDocument doc;
            doc["name"] = "Poseidone";
            doc["maintenance"] = true;
            doc["online"] = false;
            std::string out;
            serializeJson(doc, out);
            id(mqtt_client).publish("vessels/self/electrical/batteries/Poseidone", out.c_str());
            return;
          }
          JsonDocument doc;
          doc["voltage"] = id(pos_voltage).state;
          doc["current"] = id(pos_current).state;
          doc["power"] = id(pos_power).state;
          doc["soc"] = id(pos_soc).state;
          doc["capacityRemaining"] = id(pos_cap_rem).state;
          doc["fullChargeCapacity"] = id(pos_full_cap).state;
          doc["minCellVoltage"] = id(pos_min_cell).state;
          doc["maxCellVoltage"] = id(pos_max_cell).state;
          doc["deltaCellVoltage"] = id(pos_delta_cell).state;
          doc["cell1"] = id(pos_cell1).state;
          doc["cell2"] = id(pos_cell2).state;
          doc["cell3"] = id(pos_cell3).state;
          doc["cell4"] = id(pos_cell4).state;
          doc["temp1"] = id(pos_temp1).state;
          doc["temp2"] = id(pos_temp2).state;
          doc["mosfetTemp"] = id(pos_mosfet_temp).state;
          doc["cycles"] = id(pos_cycles).state;
          doc["runtimeS"] = id(pos_runtime).state;
          doc["errors"] = id(pos_errors).state;
          if (id(maintenance_cooldown) > 0) {
            id(maintenance_cooldown)--;
            doc["warning"] = 0;
          } else if (id(boot_cooldown) > 0) {
            id(boot_cooldown)--;
            doc["warning"] = 0;
