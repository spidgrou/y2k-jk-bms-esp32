substitutions:
  name: jk-bms-bridge
  friendly_name: "JK BMS Bridge"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  on_connect:
    - logger.log: "WiFi connesso!"
  on_disconnect:
    - logger.log: "WiFi disconnesso!"

ota:
  platform: esphome
  password: !secret ota_password
  on_begin:
    - logger.log: "OTA update iniziato!"
  on_end:
    - logger.log: "OTA update completato!"

safe_mode:

# Globals for offline debounce (10 min = 120 polls x 5s)
globals:
  - id: thor_was_online
    type: bool
    initial_value: 'true'
  - id: pos_was_online
    type: bool
    initial_value: 'true'
  - id: zeus_was_online
    type: bool
    initial_value: 'true'
  - id: odin_was_online
    type: bool
    initial_value: 'true'
  - id: maintenance_mode
    type: bool
    initial_value: 'false'
  - id: maintenance_cooldown
    type: int
    initial_value: '0'
  - id: thor_maintenance
    type: bool
    initial_value: 'false'
  - id: pos_maintenance
    type: bool
    initial_value: 'false'
  - id: zeus_maintenance
    type: bool
    initial_value: 'false'
  - id: odin_maintenance
    type: bool
    initial_value: 'false'
  - id: boot_cooldown
    type: int
    initial_value: '48'

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: 1883
  discovery: false
  on_connect:
    - logger.log: "MQTT connesso!"
  on_message:
    - topic: vessels/self/electrical/batteries/maintenance
      payload: '1'
      then:
        - lambda: |-
            id(maintenance_mode) = true;
            id(maintenance_cooldown) = 48;
            ESP_LOGI("maintenance", "Maintenance ON - disconnecting all BLE");
            id(client0).set_auto_connect(false);
            id(client0).disconnect();
            id(client1).set_auto_connect(false);
            id(client1).disconnect();
            id(client2).set_auto_connect(false);
            id(client2).disconnect();
            id(client3).set_auto_connect(false);
            id(client3).disconnect();
        - mqtt.publish:
            topic: vessels/self/electrical/batteries/status
            payload: '{"maintenance":true,"mode":"pause","batteries":"all-disconnected"}'
    - topic: vessels/self/electrical/batteries/maintenance
      payload: '0'
      then:
        - lambda: |-
            id(maintenance_mode) = false;
            id(maintenance_cooldown) = 48;
            ESP_LOGI("maintenance", "Maintenance OFF - reconnecting BLE");
            id(client0).set_auto_connect(true);
            id(client1).set_auto_connect(true);
            id(client2).set_auto_connect(true);
            id(client3).set_auto_connect(true);
        - mqtt.publish:
            topic: vessels/self/electrical/batteries/status
            payload: '{"maintenance":false,"mode":"normal","batteries":"reconnecting"}'
    # --- Per-battery maintenance: Thor ---
    - topic: vessels/self/electrical/batteries/Thor/maintenance
      payload: '1'
      then:
        - lambda: |-
            id(thor_maintenance) = true;
            id(maintenance_cooldown) = 48;
            ESP_LOGI("maintenance", "Thor maintenance ON - disconnecting BLE");
            id(client0).set_auto_connect(false);
            id(client0).disconnect();
        - mqtt.publish:
            topic: vessels/self/electrical/batteries/status
            payload: '{"maintenance":true,"mode":"pause","batteries":"Thor"}'
    - topic: vessels/self/electrical/batteries/Thor/maintenance
      payload: '0'
      then:
        - lambda: |-
            id(thor_maintenance) = false;
            id(maintenance_cooldown) = 48;
            ESP_LOGI("maintenance", "Thor maintenance OFF - reconnecting BLE");
            id(client0).set_auto_connect(true);
        - mqtt.publish:
            topic: vessels/self/electrical/batteries/status
            payload: '{"maintenance":false,"mode":"normal","batteries":"Thor"}'
    # --- Per-battery maintenance: Poseidone ---
    - topic: vessels/self/electrical/batteries/Poseidone/maintenance
      payload: '1'
      then:
        - lambda: |-
            id(pos_maintenance) = true;
            id(maintenance_cooldown) = 48;
            ESP_LOGI("maintenance", "Poseidone maintenance ON - disconnecting BLE");
            id(client1).set_auto_connect(false);
            id(client1).disconnect();
        - mqtt.publish:
            topic: vessels/self/electrical/batteries/status
            payload: '{"maintenance":true,"mode":"pause","batteries":"Poseidone"}'
    - topic: vessels/self/electrical/batteries/Poseidone/maintenance
      payload: '0'
      then:
        - lambda: |-
            id(pos_maintenance) = false;
            id(maintenance_cooldown) = 48;
            ESP_LOGI("maintenance", "Poseidone maintenance OFF - reconnecting BLE");
            id(client1).set_auto_connect(true);
        - mqtt.publish:
            topic: vessels/self/electrical/batteries/status
            payload: '{"maintenance":false,"mode":"normal","batteries":"Poseidone"}'
    # --- Per-battery maintenance: Zeus ---
    - topic: vessels/self/electrical/batteries/Zeus/maintenance
      payload: '1'
      then:
        - lambda: |-
            id(zeus_maintenance) = true;
            id(maintenance_cooldown) = 48;
            ESP_LOGI("maintenance", "Zeus maintenance ON - disconnecting BLE");
            id(client2).set_auto_connect(false);
            id(client2).disconnect();
        - mqtt.publish:
            topic: vessels/self/electrical/batteries/status
            payload: '{"maintenance":true,"mode":"pause","batteries":"Zeus"}'
    - topic: vessels/self/electrical/batteries/Zeus/maintenance
      payload: '0'
      then:
        - lambda: |-
            id(zeus_maintenance) = false;
            id(maintenance_cooldown) = 48;
            ESP_LOGI("maintenance", "Zeus maintenance OFF - reconnecting BLE");
            id(client2).set_auto_connect(true);
        - mqtt.publish:
            topic: vessels/self/electrical/batteries/status
            payload: '{"maintenance":false,"mode":"normal","batteries":"Zeus"}'
    # --- Per-battery maintenance: Odino ---
    - topic: vessels/self/electrical/batteries/Odino/maintenance
      payload: '1'
      then:
        - lambda: |-
            id(odin_maintenance) = true;
            id(maintenance_cooldown) = 48;
            ESP_LOGI("maintenance", "Odino maintenance ON - disconnecting BLE");
            id(client3).set_auto_connect(false);
            id(client3).disconnect();
        - mqtt.publish:
            topic: vessels/self/electrical/batteries/status
            payload: '{"maintenance":true,"mode":"pause","batteries":"Odino"}'
    - topic: vessels/self/electrical/batteries/Odino/maintenance
      payload: '0'
      then:
        - lambda: |-
            id(odin_maintenance) = false;
            id(maintenance_cooldown) = 48;
            ESP_LOGI("maintenance", "Odino maintenance OFF - reconnecting BLE");
            id(client3).set_auto_connect(true);
        - mqtt.publish:
            topic: vessels/self/electrical/batteries/status
            payload: '{"maintenance":false,"mode":"normal","batteries":"Odino"}'

external_components:
  - source: github://syssi/esphome-jk-bms
    refresh: 0s

# BLE: support for 4 simultaneous connections
esp32_ble:
  max_connections: 4

esp32_ble_tracker:

# BLE CLIENTS: 4 JK BMS
ble_client:
  - mac_address: !secret bms1_mac
    id: client0
  - mac_address: !secret bms2_mac
    id: client1
  - mac_address: !secret bms3_mac
    id: client2
  - mac_address: !secret bms4_mac
    id: client3

# JK BMS DEFINITIONS
jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 5s
    id: bms0
  - ble_client_id: client1
    protocol_version: JK02_32S
    throttle: 5s
    id: bms1
  - ble_client_id: client2
    protocol_version: JK02_32S
    throttle: 5s
    id: bms2
  - ble_client_id: client3
    protocol_version: JK02_32S
    throttle: 5s
    id: bms3

